[bar.default]
background_opacity = 0.69999999999999996
end = [
    "media",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "power_profile",
    "notifications",
    "session"
]
margin_ends = 20
start = [ "launcher", "wallpaper", "mpvpaper", "workspaces" ]

[brightness]
minimum_brightness = 0.01

[hooks]
battery_charging = ""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 200

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@Virtual-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1024.0
    cy = 832.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 624.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 384.0
    cx = 1024.0
    cy = 576.0
    output = "Virtual-1"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 128.0
    box_width = 320.0
    cx = 768.0
    cy = 368.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

[osd.kinds]
media = false

[plugin_settings."noctalia/mpvpaper"]
picker_placement = "attached"
video_directory = "~/Wallpapers"

[plugins]
enabled = [ "noctalia/mpvpaper" ]

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/vikram/Wallpapers"

    [wallpaper.default]
    path = "/home/vikram/Wallpapers/p3-dark.jpeg"

    [wallpaper.last]
    path = "/home/vikram/Wallpapers/p3-dark.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/vikram/Wallpapers/p3-dark.jpeg"

[widget.clock]
capsule = true
format = "{:%H:%M:%S}"
scale = 1.1000000000000001

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.network]
show_label = false
